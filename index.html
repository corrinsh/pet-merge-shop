<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>萌宠合成店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#FFF9F2 0%,#FFE8D6 60%,#FFDCC4 100%);color:#5D4037;user-select:none;position:relative}

/* ===== 背景装饰 ===== */
.bg-clouds{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;background:rgba(255,255,255,.6);border-radius:50px;filter:blur(2px);animation:drift linear infinite}
.cloud:nth-child(1){width:120px;height:50px;top:8%;animation-duration:40s}
.cloud:nth-child(2){width:80px;height:35px;top:20%;animation-duration:55s;animation-delay:-15s}
.cloud:nth-child(3){width:100px;height:42px;top:55%;animation-duration:48s;animation-delay:-30s}
.cloud:nth-child(4){width:60px;height:28px;top:72%;animation-duration:60s;animation-delay:-8s}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(calc(100vw + 150px))}}

.bg-petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.petal{position:absolute;width:12px;height:12px;background:radial-gradient(circle,#FFCDD2,#F8BBD0);border-radius:0 12px 0 12px;opacity:.5;animation:fall linear infinite}
.petal:nth-child(1){left:10%;animation-duration:12s}
.petal:nth-child(2){left:30%;animation-duration:18s;animation-delay:-5s}
.petal:nth-child(3){left:55%;animation-duration:15s;animation-delay:-3s}
.petal:nth-child(4){left:75%;animation-duration:20s;animation-delay:-10s}
.petal:nth-child(5){left:88%;animation-duration:14s;animation-delay:-7s}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:.5}80%{opacity:.4}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}

/* ===== 通用 ===== */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;transition:opacity .3s}
.screen.hidden{opacity:0;pointer-events:none}
.btn{border:none;cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(93,64,55,.88);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}

/* ===== 菜单 ===== */
#screen-menu{overflow-y:auto;padding:20px 16px}
.menu-title{text-align:center;margin:20px 0 8px}
.menu-title .logo{font-size:28px;font-weight:800;color:#E65100;letter-spacing:2px;text-shadow:0 2px 0 rgba(255,138,101,.2)}
.menu-title .sub{font-size:12px;color:#8D6E63;margin-top:4px}
.menu-mascot{text-align:center;margin:10px 0}
.menu-mascot svg{width:80px;height:80px}

/* 钱包+签到栏 */
.wallet-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px}
.wallet-badge{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);border-radius:16px;padding:5px 14px;border:2px solid #FFCC80}
.wallet-badge .ico{font-size:14px}
.wallet-badge .val{font-size:15px;font-weight:700;color:#E65100}
.checkin-btn{background:linear-gradient(135deg,#FF8A65,#FF7043);color:#fff;border:none;border-radius:16px;padding:6px 16px;font-size:13px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:4px;cursor:pointer;position:relative;transition:transform .1s}
.checkin-btn:active{transform:scale(.93)}
.checkin-btn .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;background:#F44336;border-radius:50%;border:2px solid #FFF9F2;animation:dotPulse 1.2s infinite}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.chapter-card{background:rgba(255,255,255,.85);border-radius:20px;margin-bottom:14px;padding:14px;box-shadow:0 4px 12px rgba(255,138,101,.1);border:2px solid #FFE0B2}
.chapter-card.locked{opacity:.5;filter:grayscale(.5)}
.ch-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch-icon{font-size:22px}
.ch-name{font-size:16px;font-weight:700;color:#5D4037;flex:1}
.ch-stars{font-size:12px;color:#FF8F00;font-weight:600}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv-btn{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;position:relative}
.lv-btn.unlocked{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border:2px solid #FFCC80}
.lv-btn.unlocked:active{transform:scale(.92)}
.lv-btn.locked{background:#F5E6D3;opacity:.5}
.lv-btn .lb-id{font-size:11px;font-weight:700;color:#BF360C}
.lv-btn .lb-stars{font-size:10px;margin-top:2px;line-height:1}
.lv-btn .lb-stars .s{color:#FFD700}
.lv-btn .lb-stars .e{color:#E0E0E0}
.lv-btn.boss{background:linear-gradient(135deg,#FFCDD2,#F8BBD0);border-color:#EF9A9A}
.lv-btn .lb-lock{font-size:18px;opacity:.4}

/* ===== 游戏画面 ===== */
#screen-game{display:flex;flex-direction:column}
.game-header{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #FFE0B2;flex-shrink:0}
.gh-back{font-size:20px;color:#8D6E63;cursor:pointer;background:none;border:none;padding:4px 8px}
.gh-info{flex:1;text-align:center}
.gh-info .lvl{font-size:14px;font-weight:700;color:#E65100}
.gh-info .ch{font-size:11px;color:#8D6E63}
.gh-badge{display:flex;align-items:center;gap:4px;background:#FFF3E0;border-radius:16px;padding:4px 12px;border:2px solid #FFCC80}
.gh-badge .ico{font-size:14px}
.gh-badge .val{font-size:15px;font-weight:700;color:#E65100}
.gh-badge.steps{background:#FFF8E8}
.gh-badge.steps .val{color:#E65100}
.gh-badge.steps.low .val{color:#D32F2F}

/* 订单面板 */
.order-panel{background:rgba(255,255,255,.92);margin:8px 12px;border-radius:18px;padding:12px 14px;box-shadow:0 2px 10px rgba(255,138,101,.08);border:2px solid #FFE0B2;flex-shrink:0}
.order-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.order-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFE0B2,#FFCC80);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.order-text{flex:1}
.order-text .who{font-size:12px;color:#8D6E63}
.order-text .want{font-size:13px;font-weight:600;color:#5D4037}
.order-goals{display:flex;gap:8px;flex-wrap:wrap}
.goal-item{display:flex;align-items:center;gap:4px;background:#FFF8E8;border-radius:12px;padding:4px 10px;border:2px solid #FFE0B2}
.goal-item.done{background:#E8F5E9;border-color:#A5D6A7}
.goal-item .gi-pet{width:28px;height:28px}
.goal-item .gi-count{font-size:14px;font-weight:700;color:#5D4037}
.goal-item.done .gi-count{color:#2E7D32}
.goal-item .gi-check{font-size:14px;color:#66BB6A}

/* 棋盘 */
.board-wrap{flex:1;overflow-y:auto;padding:8px 12px;display:flex;align-items:center;justify-content:center}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;width:100%}
.slot{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:transform .12s,box-shadow .2s}
.slot.empty{background:rgba(255,255,255,.35);border:2px dashed #FFCCBC}
.slot.empty::after{content:"";width:6px;height:6px;border-radius:50%;background:#FFCCBC;opacity:.3}
.slot.pet{background:linear-gradient(145deg,#FFFFFF,#FFF8F0);border:2px solid #FFE0B2;box-shadow:0 2px 8px rgba(255,138,101,.1)}
.slot.pet svg{width:80%;height:80%;pointer-events:none}
.slot .lv-badge{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#fff;background:rgba(216,96,0,.8);border-radius:8px;padding:1px 5px}
/* 稀有度边框 */
.slot.pet.rarity-R{border-color:#64B5F6;box-shadow:0 0 0 2px rgba(100,181,246,.2),0 2px 8px rgba(100,181,246,.15)}
.slot.pet.rarity-SR{border-color:#CE93D8;box-shadow:0 0 0 2px rgba(206,147,216,.25),0 2px 10px rgba(206,147,216,.2)}
.slot.pet.rarity-SSR{border-color:#FFD700;box-shadow:0 0 0 3px rgba(255,215,0,.25),0 2px 12px rgba(255,215,0,.25);animation:ssrShine 2s ease-in-out infinite}
@keyframes ssrShine{0%,100%{box-shadow:0 0 0 3px rgba(255,215,0,.25),0 2px 12px rgba(255,215,0,.25)}50%{box-shadow:0 0 0 3px rgba(255,215,0,.4),0 2px 16px rgba(255,215,0,.35)}}
.slot .rarity-tag{position:absolute;top:3px;left:5px;font-size:8px;font-weight:700;color:#fff;border-radius:6px;padding:1px 4px}
.slot .rarity-tag.R{background:rgba(33,150,243,.85)}
.slot .rarity-tag.SR{background:rgba(156,39,176,.85)}
.slot .rarity-tag.SSR{background:linear-gradient(90deg,#FF6F00,#FFD700)}
.slot.sel{border-color:#FF8A65;box-shadow:0 0 0 3px rgba(255,138,101,.25),0 4px 12px rgba(255,138,101,.2);transform:scale(1.04)}
.slot.goal-glow{border-color:#66BB6A;box-shadow:0 0 0 3px rgba(102,187,106,.3),0 2px 12px rgba(102,187,106,.15)}
.slot.merge-in{animation:popIn .4s ease}
@keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* 操作栏 */
.action-bar{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:10px 12px 14px;border-top:2px solid #FFE0B2;display:flex;gap:8px;flex-shrink:0}
.ab-btn{flex:1;border:none;border-radius:16px;padding:10px 4px;font-size:12px;font-weight:600;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;transition:transform .1s;position:relative}
.ab-btn:active{transform:scale(.94)}
.ab-btn .ico{font-size:18px}
.ab-btn .sub{font-size:10px;font-weight:400;opacity:.8}
.ab-btn.buy{background:linear-gradient(135deg,#FFE082,#FFCA28);color:#5D4037;border:2px solid #FFB300}
.ab-btn.deliver{background:linear-gradient(135deg,#A5D6A7,#66BB6A);color:#1B5E20;border:2px solid #43A047}
.ab-btn.deliver.ready{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(102,187,106,.5)}50%{box-shadow:0 0 0 8px rgba(102,187,106,0)}}
.ab-btn.deliver.disabled{background:#E8E0D0;color:#A09080;border-color:#D0C8B8}
.ab-btn.ad{background:linear-gradient(135deg,#CE93D8,#BA68C8);color:#4A148C;border:2px solid #AB47BC}
.ab-btn:disabled{opacity:.5;filter:grayscale(.3)}
.ab-btn.hidden{display:none}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(93,64,55,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.ov-card{background:linear-gradient(180deg,#FFFBF5,#FFF4E8);border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);width:min(340px,86%);border:3px solid #FFE0B2}

/* 结果弹窗 */
.result-title{font-size:22px;font-weight:800;margin-bottom:6px}
.result-title.win{color:#E65100}
.result-title.lose{color:#D32F2F}
.result-sub{font-size:13px;color:#8D6E63;margin-bottom:16px}
.star-row{display:flex;justify-content:center;gap:12px;margin:16px 0}
.star-slot{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#E0E0E0;transition:all .3s}
.star-slot.on{color:#FFD700;text-shadow:0 0 12px rgba(255,215,0,.5);animation:starPop .4s ease}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.result-reward{font-size:14px;color:#5D4037;margin:8px 0 16px}
.result-reward .coins{font-size:22px;font-weight:700;color:#FF8F00}
.result-reward .first-clear{display:block;font-size:12px;color:#E91E63;margin-top:4px}
.ov-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ov-btn{border:none;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:600;font-family:inherit;transition:transform .1s}
.ov-btn:active{transform:scale(.93)}
.ov-btn.primary{background:linear-gradient(135deg,#FF8A65,#FF7043);color:#fff;border:2px solid #E65100}
.ov-btn.secondary{background:#FFF3E0;color:#8D6E63;border:2px solid #FFCC80}
.ov-btn.ad{background:linear-gradient(135deg,#CE93D8,#BA68C8);color:#fff;border:2px solid #AB47BC}

/* 剧情弹窗 */
.story-ch{font-size:18px;font-weight:700;color:#E65100;margin-bottom:4px}
.story-icon{font-size:40px;margin-bottom:8px}
.story-text{font-size:14px;color:#5D4037;line-height:1.7;margin:12px 0 20px;text-align:left}

/* 广告弹窗 */
.ad-card .ad-title{font-size:16px;font-weight:600;color:#5D4037;margin-bottom:8px}
.ad-card .ad-count{font-size:42px;font-weight:800;color:#FF8A65;margin:8px 0}
.ad-card .ad-tip{font-size:11px;color:#BCAAA4;margin-bottom:14px}
.ad-card .ad-skip{font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#FF8A65,#FF7043);border:none;border-radius:14px;padding:10px 24px;cursor:pointer;font-family:inherit}
.ad-card .ad-skip:disabled{background:#B0AAA0}

/* 签到弹窗 */
.checkin-card{width:min(360px,90%)}
.checkin-title{font-size:20px;font-weight:800;color:#E65100;margin-bottom:4px}
.checkin-sub{font-size:12px;color:#8D6E63;margin-bottom:16px}
.checkin-calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.checkin-day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF3E0;border:2px solid #FFCC80;position:relative;gap:2px}
.checkin-day.claimed{background:#E8F5E9;border-color:#A5D6A7}
.checkin-day.today{border-color:#FF8A65;box-shadow:0 0 0 3px rgba(255,138,101,.2)}
.checkin-day .cd-label{font-size:11px;color:#8D6E63;font-weight:600}
.checkin-day .cd-reward{font-size:13px;font-weight:700;color:#E65100}
.checkin-day.claimed .cd-reward{color:#2E7D32}
.checkin-day .cd-check{position:absolute;top:2px;right:4px;font-size:14px;color:#66BB6A}
.checkin-day .cd-emoji{font-size:18px}

/* 粒子 */
.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:150;animation:particleFly .6s ease-out forwards}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

.float-coin{position:fixed;pointer-events:none;font-size:16px;font-weight:700;color:#FF8F00;text-shadow:0 1px 3px rgba(0,0,0,.15);animation:floatUp .9s ease forwards;z-index:150}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}

.hint{text-align:center;font-size:11px;color:#BCAAA4;padding:4px 0}
</style>
</head>
<body>

<div class="bg-clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
<div class="bg-petals"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div>

<!-- 菜单 -->
<div id="screen-menu" class="screen">
  <div class="menu-mascot" id="menuMascot"></div>
  <div class="menu-title"><div class="logo">萌宠合成店</div><div class="sub">合成萌宠 · 完成订单 · 收集图鉴</div></div>
  <div class="wallet-bar">
    <div class="wallet-badge"><span class="ico">💰</span><span class="val" id="walletVal">0</span></div>
    <button class="checkin-btn" id="btnCheckin">📅 每日签到</button>
  </div>
  <div id="chapterList" style="margin-top:12px"></div>
</div>

<!-- 游戏画面 -->
<div id="screen-game" class="screen hidden">
  <div class="game-header">
    <button class="gh-back" id="btnBack">&larr;</button>
    <div class="gh-info">
      <div class="lvl" id="ghLevel">1-1</div>
      <div class="ch" id="ghChapter">开业大吉</div>
    </div>
    <div class="gh-badge steps" id="ghSteps"><span class="ico">🎯</span><span class="val" id="ghStepsVal">5</span></div>
    <div class="gh-badge" id="ghCoins"><span class="ico">💰</span><span class="val" id="ghCoinsVal">0</span></div>
  </div>
  <div class="order-panel">
    <div class="order-top">
      <div class="order-avatar" id="orderAvatar">👧</div>
      <div class="order-text">
        <div class="who" id="orderWho">小女孩</div>
        <div class="want" id="orderWant">我想要可爱的萌宠！</div>
      </div>
    </div>
    <div class="order-goals" id="orderGoals"></div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
  <div class="action-bar" id="actionBar">
    <button class="ab-btn buy" id="btnBuy"><span class="ico">🥚</span>买蛋<span class="sub" id="btnBuySub">10💰</span></button>
    <button class="ab-btn deliver disabled" id="btnDeliver"><span class="ico">📦</span>完成订单<span class="sub">需凑齐萌宠</span></button>
    <button class="ab-btn ad hidden" id="btnAdEgg"><span class="ico">📺</span>免费蛋<span class="sub" id="btnAdEggSub">看广告</span></button>
    <button class="ab-btn ad hidden" id="btnAdSteps"><span class="ico">📺</span>+5步<span class="sub" id="btnAdStepsSub">看广告</span></button>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="overlay" id="ovResult">
  <div class="ov-card">
    <div class="result-title" id="resultTitle">订单完成！</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="star-row" id="starRow"></div>
    <div class="result-reward" id="resultReward"></div>
    <div class="ov-btns" id="resultBtns"></div>
  </div>
</div>

<!-- 剧情弹窗 -->
<div class="overlay" id="ovStory">
  <div class="ov-card">
    <div class="story-icon" id="storyIcon">🏪</div>
    <div class="story-ch" id="storyCh">第一章 · 开业大吉</div>
    <div class="story-text" id="storyText"></div>
    <button class="ov-btn primary" id="storyStart">开始营业</button>
  </div>
</div>

<!-- 广告弹窗 -->
<div class="overlay" id="ovAd">
  <div class="ov-card ad-card">
    <div class="ad-title">广告播放中…</div>
    <div class="ad-count" id="adCount">3</div>
    <div class="ad-tip">（原型模拟广告，上线后接入真实激励视频 SDK）</div>
    <button class="ad-skip" id="adSkip" disabled>跳过广告</button>
  </div>
</div>

<!-- 签到弹窗 -->
<div class="overlay" id="ovCheckin">
  <div class="ov-card checkin-card">
    <div class="checkin-title">每日签到</div>
    <div class="checkin-sub">连续签到奖励递增，Day7 有大奖！</div>
    <div class="checkin-calendar" id="checkinCalendar"></div>
    <div class="ov-btns">
      <button class="ov-btn primary" id="checkinClaim">领取今日奖励</button>
      <button class="ov-btn secondary" id="checkinClose">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   关卡数据（66 关，来自生成器配表）
   g=goal[[lv,count]], b=board{lv:count}, co=coins, s=steps
   s2/s3=星级阈值(剩余步数比例), ad={ps:plusSteps,fe:freeEgg,dr:doubleReward,hp:halfPrice}
   ============================================================ */
var LEVELS=[
/* Ch1 开业大吉 */
{id:"1-1",ch:1,cn:"开业大吉",t:"T1",g:[{l:2,c:1}],b:{1:2},co:0,s:5,s2:.25,s3:.45,ad:{ps:5,fe:1}},

function getSpecies(lv,sp){
 sp=sp||0;
 var arr=SPECIES_BY_LEVEL[lv]||SPECIES_BY_LEVEL[1];
 return arr[sp]||arr[0];
}

/* 买蛋价格: 10 * 1.25^(n-1) — 曲线放缓，防止后期买不起 */
function buyPrice(n){return Math.round(10*Math.pow(1.25,n-1))}

/* 合成时 roll 物种变种：N=79.5% R=18% SR=2% SSR=0.5% */
function rollSpecies(lv){
 var arr=SPECIES_BY_LEVEL[lv];
 if(!arr||arr.length<=1)return 0;
 var r=Math.random();
 if(r<0.005){var i=arr.findIndex(function(s){return s.rarity==="SSR"});if(i>=0)return i}
 if(r<0.025){var i=arr.findIndex(function(s){return s.rarity==="SR"});if(i>=0)return i}
 if(r<0.205){var i=arr.findIndex(function(s){return s.rarity==="R"});if(i>=0)return i}
 var nIdx=arr.findIndex(function(s){return s.rarity==="N"});
 return nIdx>=0?nIdx:0;
}

/* 颜色明暗调整 */
function shade(hex,amt){
 var c=hex.replace('#','');
 if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
 var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
 r=Math.max(0,Math.min(255,r+amt));
 g=Math.max(0,Math.min(255,g+amt));
 b=Math.max(0,Math.min(255,b+amt));
 return'#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

function loadSave(){
  try{
    var r=localStorage.getItem("petShopSave");
    if(!r)return null;
    var d=JSON.parse(r);
    if(!d.stars||d.stars.length<66)d.stars=newArray(66,0);
    if(!d.seen||d.seen.length<6)d.seen=newArray(6,false);
    if(typeof d.wallet!=="number")d.wallet=0;
    if(!d.checkIn)d.checkIn={lastClaim:null,streak:0};
    if(!d.collection)d.collection={};
    return d;
  }catch(e){return null}
}
function saveSave(){

function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?(n/1e3).toFixed(1)+"k":Math.floor(n).toString()}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1600)}
function randItem(a){return a[Math.floor(Math.random()*a.length)]}
function processGoals(g){
  var map={};
  g.forEach(function(x){map[x.l]=(map[x.l]||0)+x.c});
  return Object.keys(map).map(function(l){return{lv:parseInt(l),count:map[l]}}).sort(function(a,b){return b.lv-a.lv});
}

  }

  var html="";
  CHAPTERS.forEach(function(ch){
    var chLevels=LEVELS.filter(function(l){return l.ch===ch.n});
    var chStart=(ch.n-1)*11;
    var chStars=0;
    for(var i=0;i<11;i++)chStars+=save.stars[chStart+i]||0;
    var maxStars=33;
    var unlocked=ch.n===1||(save.stars[(ch.n-2)*11+10]>0);

    html+='<div class="chapter-card'+(unlocked?"":" locked")+'">';
    html+='<div class="ch-head"><span class="ch-icon">'+ch.icon+'</span>';
    html+='<span class="ch-name">第'+ch.n+'章 '+ch.name+'</span>';
    html+='<span class="ch-stars">⭐'+chStars+'/'+maxStars+'</span></div>';
    html+='<div class="level-grid">';
    chLevels.forEach(function(lv,i){
      var idx=chStart+i;
      var ls=save.stars[idx]||0;
      var lu=idx<=save.progress;
      var isBoss=lv.t==="B";
      html+='<div class="lv-btn'+(lu?" unlocked":" locked")+(isBoss?" boss":"")+'" data-level="'+idx+'">';
      if(lu){
        html+='<div class="lb-id">'+lv.id+'</div>';
        html+='<div class="lb-stars">';
        for(var s=0;s<3;s++)html+='<span class="'+(s<ls?"s":"e")+'">★</span>';
        html+='</div>';
      }else{
        html+='<div class="lb-lock">🔒</div>';
      }
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById("chapterList").innerHTML=html;

  document.querySelectorAll(".lv-btn.unlocked").forEach(function(b){
    b.addEventListener("click",function(){
      var idx=parseInt(b.dataset.level,10);
      startLevel(idx);
    });
  });
}

/* ============================================================
   关卡初始化
   ============================================================ */
function startLevel(idx){
  state.levelIdx=idx;
  var lv=LEVELS[idx];
  state.level=lv;
  state.goals=processGoals(lv.g);
  state.maxSteps=lv.s;
  state.steps=lv.s;
  state.coins=lv.co+(save.wallet||0);
  save.wallet=0;
  saveSave();
  state.bought=0;
  state.halfPrice=false;
  state.selected=null;
  state.adUsed={freeEgg:false,plusSteps:false};

  state.board=[];
  state.nextId=1;
  var pets=[];
  Object.keys(lv.b).forEach(function(lvStr){
    var lvNum=parseInt(lvStr);
    var cnt=lv.b[lvStr];
    for(var i=0;i<cnt;i++)pets.push({id:state.nextId++,lv:lvNum,sp:0});
  });
  for(var i=pets.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=pets[i];pets[i]=pets[j];pets[j]=t;
  }
  while(pets.length<MAX_SLOTS)pets.push(null);
  state.board=pets;

  var ch=lv.ch;
  if(!save.seen[ch-1]){
    showStory(ch);
  }else{
    showGame();
    renderGame();
  }
}

/* ============================================================
   剧情弹窗
   ============================================================ */
function showStory(ch){
  var c=CHAPTERS[ch-1];
  document.getElementById("storyIcon").textContent=c.icon;
  document.getElementById("storyCh").textContent="第"+ch+"章 · "+c.name;
  document.getElementById("storyText").textContent=c.story;
  document.getElementById("ovStory").classList.add("show");
  save.seen[ch-1]=true;
  saveSave();
}
document.getElementById("storyStart").addEventListener("click",function(){
  document.getElementById("ovStory").classList.remove("show");
  showGame();
  renderGame();
});

/* ============================================================
   游戏渲染
   ============================================================ */
function renderGame(){
  var lv=state.level;
  document.getElementById("ghLevel").textContent=lv.id;
  document.getElementById("ghChapter").textContent=lv.cn;
  document.getElementById("ghStepsVal").textContent=state.steps;
  document.getElementById("ghCoinsVal").textContent=fmt(state.coins);

  var stepsBadge=document.getElementById("ghSteps");
  if(state.steps<=2)stepsBadge.classList.add("low");
  else stepsBadge.classList.remove("low");

  var customerIdx=(state.levelIdx*7)%CUSTOMERS.length;
  document.getElementById("orderAvatar").textContent=CUSTOMERS[customerIdx];
  document.getElementById("orderWho").textContent="顾客";
  document.getElementById("orderWant").textContent=randItem(ORDER_TEXTS);

  var goalsHtml="";
  var goalStatus=getGoalStatus();
  state.goals.forEach(function(g,i){
    var st=goalStatus[i];
    var cls=st.fulfilled?"done":"";
    goalsHtml+='<div class="goal-item '+cls+'">';
    goalsHtml+='<div class="gi-pet">'+petSVG(g.lv,0)+'</div>';
    goalsHtml+='<span class="gi-count">'+st.have+'/'+g.count+'</span>';
    if(st.fulfilled)goalsHtml+='<span class="gi-check">✓</span>';
    goalsHtml+='</div>';
  });
  document.getElementById("orderGoals").innerHTML=goalsHtml;

  var boardHtml="";
  for(var i=0;i<MAX_SLOTS;i++){
    var p=state.board[i];
    if(p){
      var sel=state.selected===p.id?" sel":"";
      var glow="";
      if(state.goals.some(function(g,idx){var st=getGoalStatus();return g.lv===p.lv&&!st[idx].fulfilled}))glow=" goal-glow";
      var sp=getSpecies(p.lv,p.sp);
      var rarCls=sp.rarity!=="N"?" rarity-"+sp.rarity:"";
      var rarTag=sp.rarity!=="N"?'<span class="rarity-tag '+sp.rarity+'">'+sp.rarity+'</span>':"";
      boardHtml+='<div class="slot pet'+sel+glow+rarCls+'" data-id="'+p.id+'">'+petSVG(p.lv,p.sp)+rarTag+'<span class="lv-badge">Lv'+p.lv+'</span></div>';
    }else{
      boardHtml+='<div class="slot empty"></div>';
    }
  }
  document.getElementById("board").innerHTML=boardHtml;

  var price=buyPrice(state.bought+1);
  if(state.halfPrice)price=Math.round(price/2);
  document.getElementById("btnBuySub").textContent=price+"💰";
  document.getElementById("btnBuy").disabled=state.coins<price||!hasEmptySlot();

  var canComplete=canCompleteOrder();
  var deliverBtn=document.getElementById("btnDeliver");
  if(canComplete){
    deliverBtn.classList.remove("disabled");
    deliverBtn.classList.add("ready");
    deliverBtn.querySelector(".sub").textContent="点击交付！";
  }else{
    deliverBtn.classList.add("disabled");
    deliverBtn.classList.remove("ready");
    deliverBtn.querySelector(".sub").textContent="需凑齐萌宠";
  }

  var ad=lv.ad||{};
  var adEggBtn=document.getElementById("btnAdEgg");
  if(ad.fe&&!state.adUsed.freeEgg){
    adEggBtn.classList.remove("hidden");
    adEggBtn.disabled=!hasEmptySlot();
  }else{
    adEggBtn.classList.add("hidden");
  }
  var adStepsBtn=document.getElementById("btnAdSteps");
  if(ad.ps&&!state.adUsed.plusSteps&&state.steps<=2){
    adStepsBtn.classList.remove("hidden");
  }else{
    adStepsBtn.classList.add("hidden");
  }
}

/* ============================================================
   订单状态
   ============================================================ */
function getGoalStatus(){
  return state.goals.map(function(g){
    var count=0;
    state.board.forEach(function(p){if(p&&p.lv===g.lv)count++});
    return{fulfilled:count>=g.count,have:Math.min(count,g.count),need:g.count};
  });
}
function canCompleteOrder(){
  return getGoalStatus().every(function(s){return s.fulfilled});
}

/* ============================================================
   棋盘操作
   ============================================================ */
function hasEmptySlot(){
  return state.board.some(function(p){return p===null});
}
function findEmptySlot(){
  for(var i=0;i<MAX_SLOTS;i++)if(state.board[i]===null)return i;
  return-1;
}

function onBoardClick(e){
  var slot=e.target.closest(".slot.pet");
  if(!slot){
    state.selected=null;renderGame();return;
  }
  var id=parseInt(slot.dataset.id,10);
  var pet=state.board.find(function(p){return p&&p.id===id});
  if(!pet)return;
  if(state.selected===null){
    state.selected=id;renderGame();return;
  }
  if(state.selected===id){
    state.selected=null;renderGame();return;
  }
  var a=state.board.find(function(p){return p&&p.id===state.selected});
  if(!a){state.selected=id;renderGame();return}
  if(a.lv===pet.lv&&pet.lv<8){
    mergePets(a,pet);
  }else{
    state.selected=id;
    toast("要选两个同等级的萌宠哦");
  }
  renderGame();
}

function mergePets(a,b){
  var newLv=a.lv+1;
  var newSp=rollSpecies(newLv);
  var idxA=state.board.indexOf(a);
  var idxB=state.board.indexOf(b);
  state.board[idxA]=null;
  state.board[idxB]={id:state.nextId++,lv:newLv,sp:newSp};
  state.selected=null;
  state.steps--;

  var slot=document.querySelector('.slot.pet[data-id="'+state.board[idxB].id+'"]');
  if(slot){
    slot.classList.add("merge-in");
    var rect=slot.getBoundingClientRect();
    spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2);
  }
  if(navigator.vibrate)navigator.vibrate(15);

  var sp=getSpecies(newLv,newSp);
  var msg="合成了 "+sp.name;
  if(sp.rarity==="SSR")msg="★★★ SSR 龙王！"+sp.name;
  else if(sp.rarity==="SR")msg="★ SR "+sp.name+"！";
  else if(sp.rarity==="R")msg="R "+sp.name+"！";
  if(newLv===8)msg+=" ★ 传说！";
  toast(msg);

  /* 图鉴收录 */
  var key=newLv+"-"+newSp;
  if(sp.rarity!=="N"&&!save.collection[key]){
    save.collection[key]=true;
    saveSave();
  }

  checkLose();
}

function buyEgg(){
  var price=buyPrice(state.bought+1);
  if(state.halfPrice)price=Math.round(price/2);
  if(state.coins<price){toast("金币不够");return}
  if(!hasEmptySlot()){toast("棋盘满了，先合成吧");return}
  var idx=findEmptySlot();
  state.board[idx]={id:state.nextId++,lv:1,sp:0};
  state.coins-=price;
  state.bought++;
  state.steps--;
  var slot=document.querySelectorAll(".slot.pet")[idx];
  if(slot)slot.classList.add("merge-in");
  toast("买到一个宠物蛋");
  renderGame();
  checkLose();
}

/* ============================================================
   完成订单
   ============================================================ */
function completeOrder(){
  if(!canCompleteOrder()){toast("还缺少萌宠哦");return}
  state.goals.forEach(function(g){
    var removed=0;
    for(var i=0;i<MAX_SLOTS&&removed<g.count;i++){
      if(state.board[i]&&state.board[i].lv===g.lv){
        state.board[i]=null;
        removed++;
      }
    }
  });
  var ratio=state.steps/state.maxSteps;
  var stars=1;
  if(ratio>=state.level.s3)stars=3;
  else if(ratio>=state.level.s2)stars=2;
  showWin(stars);
}

/* ============================================================
   胜利/失败
   ============================================================ */
function showWin(stars){
  var firstClear=(save.stars[state.levelIdx]||0)===0;
  if(stars>(save.stars[state.levelIdx]||0)){
    save.stars[state.levelIdx]=stars;
  }
  if(state.levelIdx>=save.progress&&state.levelIdx<65){
    save.progress=state.levelIdx+1;
  }

  var baseReward=10*state.level.ch;
  var starBonus=5*stars;
  var reward=baseReward+starBonus;
  if(state.level.t==="F")reward*=2;
  if(firstClear)reward=Math.round(reward*1.5);
  reward=Math.max(reward,5);

  save.wallet=(save.wallet||0)+reward;
  saveSave();

  document.getElementById("resultTitle").textContent="订单完成！";
  document.getElementById("resultTitle").className="result-title win";
  document.getElementById("resultSub").textContent=getSpecies(state.goals[0].lv,0).name+" 已送达～";
  var starHtml="";
  for(var i=0;i<3;i++)starHtml+='<div class="star-slot" data-i="'+i+'">★</div>';
  document.getElementById("starRow").innerHTML=starHtml;
  setTimeout(function(){
    document.querySelectorAll(".star-slot").forEach(function(s,i){
      if(i<stars)setTimeout(function(){s.classList.add("on")},i*300);
    });
  },200);

  var rewardHtml='获得金币 <span class="coins">+'+reward+'</span>';
  if(firstClear)rewardHtml+='<span class="first-clear">首通奖励 +50%！</span>';
  document.getElementById("resultReward").innerHTML=rewardHtml;

  var btnsHtml="";
  var ad=state.level.ad||{};
  if(ad.dr){
    btnsHtml+='<button class="ov-btn ad" id="btnDoubleReward">📺 双倍奖励</button>';
  }
  if(state.levelIdx<65){
    btnsHtml+='<button class="ov-btn primary" id="btnNext">下一关 →</button>';
  }
  btnsHtml+='<button class="ov-btn secondary" id="btnReplay">重玩</button>';
  btnsHtml+='<button class="ov-btn secondary" id="btnMenu">菜单</button>';
  document.getElementById("resultBtns").innerHTML=btnsHtml;

  if(ad.dr){
    document.getElementById("btnDoubleReward").addEventListener("click",function(){
      showAd(function(){
        save.wallet=(save.wallet||0)+reward;
        saveSave();
        document.getElementById("resultReward").innerHTML='获得金币 <span class="coins">+'+(reward*2)+'</span>';
        floatCoins(reward*2);
        document.getElementById("btnDoubleReward").disabled=true;
        document.getElementById("btnDoubleReward").textContent="已领取";
      });
    });
  }
  if(state.levelIdx<65){
    document.getElementById("btnNext").addEventListener("click",function(){
      document.getElementById("ovResult").classList.remove("show");
      startLevel(state.levelIdx+1);
    });
  }
  document.getElementById("btnReplay").addEventListener("click",function(){
    document.getElementById("ovResult").classList.remove("show");
    startLevel(state.levelIdx);
  });
  document.getElementById("btnMenu").addEventListener("click",function(){
    document.getElementById("ovResult").classList.remove("show");
    showMenu();
  });

  setTimeout(function(){document.getElementById("ovResult").classList.add("show")},600);
  floatCoins(reward);
}

function checkLose(){
  if(state.steps<=0&&!canCompleteOrder()){
    setTimeout(function(){
      document.getElementById("resultTitle").textContent="步数用完了";
      document.getElementById("resultTitle").className="result-title lose";
      document.getElementById("resultSub").textContent="别灰心，再试一次！";
      document.getElementById("starRow").innerHTML="";
      document.getElementById("resultReward").innerHTML="";

      var btnsHtml="";
      var ad=state.level.ad||{};
      if(ad.ps&&!state.adUsed.plusSteps){
        btnsHtml+='<button class="ov-btn ad" id="btnAdStepsLose">📺 +5步继续</button>';
      }
      btnsHtml+='<button class="ov-btn primary" id="btnRetry">重试</button>';
      btnsHtml+='<button class="ov-btn secondary" id="btnMenuLose">菜单</button>';
      document.getElementById("resultBtns").innerHTML=btnsHtml;

      if(ad.ps&&!state.adUsed.plusSteps){
        document.getElementById("btnAdStepsLose").addEventListener("click",function(){
          showAd(function(){
            state.adUsed.plusSteps=true;
            state.steps+=ad.ps;
            document.getElementById("ovResult").classList.remove("show");
            renderGame();
            toast("+"+ad.ps+" 步！继续加油！");
          });
        });
      }
      document.getElementById("btnRetry").addEventListener("click",function(){
        document.getElementById("ovResult").classList.remove("show");
        startLevel(state.levelIdx);
      });
      document.getElementById("btnMenuLose").addEventListener("click",function(){
        document.getElementById("ovResult").classList.remove("show");
        showMenu();
      });

      document.getElementById("ovResult").classList.add("show");
    },400);
  }
}

/* ============================================================
   广告模拟
   ============================================================ */
var adTimer=null;
function showAd(cb){
  var ov=document.getElementById("ovAd");
  var cnt=document.getElementById("adCount");
  var sk=document.getElementById("adSkip");
  ov.classList.add("show");
  var left=3;
  cnt.textContent=left;
  sk.disabled=true;
  clearInterval(adTimer);
  adTimer=setInterval(function(){
    left--;
    if(left<=0){
      clearInterval(adTimer);
      sk.disabled=false;
      cnt.textContent="✓";
    }else{
      cnt.textContent=left;
    }
  },1000);
  sk.onclick=function(){ov.classList.remove("show");cb()};
}

document.getElementById("btnAdEgg").addEventListener("click",function(){
  showAd(function(){
    if(!hasEmptySlot()){toast("棋盘满了");return}
    var idx=findEmptySlot();
    state.board[idx]={id:state.nextId++,lv:1,sp:0};
    state.adUsed.freeEgg=true;
    var slot=document.querySelectorAll(".slot.pet")[idx];
    if(slot){
      slot.classList.add("merge-in");
      var rect=slot.getBoundingClientRect();
      spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2);
    }
    toast("免费蛋到手！");
    renderGame();
  });
});

document.getElementById("btnAdSteps").addEventListener("click",function(){
  showAd(function(){
    state.adUsed.plusSteps=true;
    state.steps+=state.level.ad.ps;
    toast("+"+state.level.ad.ps+" 步！");
    renderGame();
  });
});

/* ============================================================
   每日签到
   ============================================================ */
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function canClaimCheckin(){
  var ci=save.checkIn||{lastClaim:null,streak:0};
  return ci.lastClaim!==todayStr();
}

function claimCheckin(){
  var ci=save.checkIn||{lastClaim:null,streak:0};
  if(ci.lastClaim===todayStr()){toast("今天已经签到了");return}

  var yesterday=new Date();
  yesterday.setDate(yesterday.getDate()-1);
  var yStr=yesterday.getFullYear()+"-"+(yesterday.getMonth()+1)+"-"+yesterday.getDate();

  if(ci.lastClaim===yStr){
    ci.streak=(ci.streak||0)+1;
    if(ci.streak>7)ci.streak=1;
  }else{
    ci.streak=1;
  }

  var dayIdx=ci.streak-1;
  var reward=CHECKIN_REWARDS[dayIdx];
  save.wallet=(save.wallet||0)+reward;
  ci.lastClaim=todayStr();
  save.checkIn=ci;
  saveSave();

  toast("签到Day"+ci.streak+"！获得 "+reward+" 金币");
  renderCheckin();
  renderMenu();
  floatCoins(reward);
}

function renderCheckin(){
  var ci=save.checkIn||{lastClaim:null,streak:0};
  var claimedToday=ci.lastClaim===todayStr();
  var displayStreak=claimedToday?ci.streak:(ci.streak||0)+1;
  if(displayStreak>7)displayStreak=1;

  var html="";
  for(var i=0;i<7;i++){
    var day=i+1;
    var claimed=ci.streak>=day&&claimedToday&&ci.streak===day;
    var isToday=day===displayStreak&&!claimedToday;
    var cls=claimed?"claimed":"";
    if(isToday)cls+=" today";
    html+='<div class="checkin-day '+cls+'">';
    html+='<div class="cd-label">Day'+day+'</div>';
    html+='<div class="cd-emoji">'+CHECKIN_EMOJIS[i]+'</div>';
    html+='<div class="cd-reward">'+CHECKIN_REWARDS[i]+'💰</div>';
    if(claimed)html+='<div class="cd-check">✓</div>';
    html+='</div>';
  }
  document.getElementById("checkinCalendar").innerHTML=html;

  var claimBtn=document.getElementById("checkinClaim");
  if(claimedToday){
    claimBtn.textContent="今日已领取";
    claimBtn.disabled=true;
  }else{
    claimBtn.textContent="领取Day"+displayStreak+"奖励";
    claimBtn.disabled=false;
  }
}

document.getElementById("btnCheckin").addEventListener("click",function(){
  renderCheckin();
  document.getElementById("ovCheckin").classList.add("show");
});
document.getElementById("checkinClaim").addEventListener("click",function(){
  claimCheckin();
});
document.getElementById("checkinClose").addEventListener("click",function(){
  document.getElementById("ovCheckin").classList.remove("show");
});

/* ============================================================
   粒子效果
   ============================================================ */
function spawnParticles(x,y){
  var colors=["#FFD54F","#FF8A65","#FFAB91","#A5D6A7","#CE93D8"];
  for(var i=0;i<6;i++){
    var p=document.createElement("div");
    p.className="particle";
    p.style.left=x+"px";
    p.style.top=y+"px";
    p.style.background=colors[i%colors.length];
    var angle=(i/6)*Math.PI*2;
    var dist=30+Math.random()*25;
    p.style.setProperty("--dx",Math.cos(angle)*dist+"px");
    p.style.setProperty("--dy",Math.sin(angle)*dist+"px");
    document.body.appendChild(p);
    setTimeout(function(){p.remove()},650);
  }
}

function floatCoins(gain){
  var el=document.createElement("div");
  el.className="float-coin";
  el.textContent="+"+fmt(gain);
  el.style.left=(Math.random()*40+30)+"%";
  el.style.top="40%";
  document.body.appendChild(el);
  setTimeout(function(){el.remove()},950);
}

document.getElementById("btnBack").addEventListener("click",function(){
  showMenu();
});
document.getElementById("board").addEventListener("click",onBoardClick);
document.getElementById("btnBuy").addEventListener("click",buyEgg);
document.getElementById("btnDeliver").addEventListener("click",completeOrder);
